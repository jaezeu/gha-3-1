name: Terraform Deployment

on:
  push:
    branches: [ "main" ]


permissions:
  id-token: write
  contents: read
    
jobs:
  CICD:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Debug OIDC claims
      run: |
        python3 - <<'EOF'
        import os, json, base64, urllib.request
        url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
        req = urllib.request.Request(url, headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
        tok = json.load(urllib.request.urlopen(req))['value']
        p = tok.split('.')[1]; p += '=' * (-len(p) % 4)
        c = json.loads(base64.urlsafe_b64decode(p))
        print(json.dumps({k: c.get(k) for k in ['iss','aud','sub','repository','repository_owner','ref','environment']}, indent=2))
        EOF
   
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.OIDC_ROLE }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
   
    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan
   
    - name: Terraform Apply
      run: terraform apply --auto-approve
